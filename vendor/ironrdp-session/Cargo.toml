[package]
name = "ironrdp-session"
version = "0.9.0"
readme = "README.md"
description = "State machines to drive an RDP session — vendored fork with a bounds-check fix in the bitmap-application path (apply_bgr24_bitmap and friends), see image.rs for details"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Devolutions/IronRDP"
repository = "https://github.com/Devolutions/IronRDP"
authors = ["Devolutions Inc. <infos@devolutions.net>", "Teleport <goteleport.com>"]
keywords = ["rdp", "remote-desktop", "network", "client", "protocol"]
categories = ["network-programming"]

[lib]
doctest = false
test = false

[features]
default = []
qoi = ["dep:qoicoubeh", "ironrdp-pdu/qoi"]
qoiz = ["dep:zstd-safe", "qoi"]

[dependencies]
# Our own patched fork (self-healing ring buffer) — see vendor/ironrdp-bulk.
ironrdp-bulk = { path = "../ironrdp-bulk", version = "0.1" }
# Everything else: plain crates.io deps, unmodified.
ironrdp-core = { version = "0.2" }
ironrdp-connector = { version = "0.9" }
ironrdp-svc = { version = "0.7" }
ironrdp-dvc = { version = "0.6" }
ironrdp-error = { version = "0.2" }
ironrdp-graphics = { version = "0.8" }
ironrdp-pdu = { version = "0.8", features = ["std"] }
ironrdp-displaycontrol = { version = "0.6" }
tracing = { version = "0.1", features = ["log"] }
qoicoubeh = { version = "0.5", optional = true }
zstd-safe = { version = "7.2", optional = true, features = ["std"] }
