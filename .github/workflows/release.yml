name: Release

# Builds unsigned installers for desktop-next and attaches them to a GitHub
# Release. Triggered by pushing a tag like `v0.2.0`.
#
# Unsigned: no code-signing certificate exists yet (see desktop-next/RELEASE.md).
# Windows SmartScreen and macOS Gatekeeper will both warn users on first run
# until that's set up — this workflow does not attempt to work around that.
#
# NOTE: the macOS packaging leg is unverified — this repo has never had a
# real macOS build/package run. Expect the first tagged release to need a
# follow-up fix once the actual failure (if any) is visible in the logs.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.2.0) — for manual re-runs"
        required: false

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-next

      - name: Install WiX v5
        run: |
          dotnet tool install --global wix
          wix extension add WixToolset.UI.wixext

      - name: Build and package
        shell: pwsh
        run: ./scripts/package-windows-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.msi
            dist/*.sha256

  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-next

      - name: Build and package
        run: |
          chmod +x scripts/package-macos-dmg.sh
          scripts/package-macos-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
            dist/*.sha256

  publish-release:
    needs: [windows-installer, macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist-artifacts/*.msi
            dist-artifacts/*.dmg
            dist-artifacts/*.sha256
