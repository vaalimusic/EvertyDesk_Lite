# Fast build configuration for EvertyDesk Lite

[target.x86_64-pc-windows-msvc]
# Use the LLD linker bundled with the Rust toolchain.
# LLD links around 3x faster than the default MSVC link.exe on large projects.
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=lld-link"]

[profile.dev]
# Keep debug info minimal in dev; enough for backtraces, not full DWARF.
# Cuts link time and binary size without hurting the debug experience much.
debug = 1
# Split each crate into many small codegen units so rustc can parallelize.
codegen-units = 256
