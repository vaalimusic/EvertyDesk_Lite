[package]
name = "evertydesk-lite"
version = "0.1.0"
edition = "2021"

[features]
default = []
live-h264 = ["dep:openh264"]

[dependencies]
base64 = "0.22"
eframe = "0.27"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
openh264 = { version = "0.9", optional = true }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
