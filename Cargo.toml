[package]
name = "evertydesk-lite"
version = "0.2.0"
edition = "2021"

# Библиотека для Android (.so через JNI) + обычный бинарь для desktop.
# `lib` — для тестов/desktop, `cdylib` — нативная либа для Android.
[lib]
name = "evertydesk_core"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[features]
default = ["live-h264", "live-vp9-mf", "live-nvenc-sdk", "desktop-gui", "evrt-wasapi"]
# Desktop GUI: eframe + arboard. Excluded from Android builds.
desktop-gui = ["dep:eframe", "dep:arboard", "dep:egui-phosphor"]
# Android клиент: собирается как cdylib с JNI-мостом, без desktop GUI.
android-client = ["dep:jni"]
live-h264  = ["dep:openh264"]
# EVRT audio capture/playback through WASAPI. Kept separate from EVRT core so
# protocol/reassembly tests can run without the Windows media stack.
evrt-wasapi = ["dep:windows"]
# FSR: параллельная обработка строк через rayon (быстрее на многоядерных CPU)
# Подключи rayon в [dependencies] и включи фичу: cargo build --features fsr-parallel
fsr-parallel = []
# FSR: GPU-ускорение через D3D11 Compute Shaders (только Windows)
fsr-gpu      = ["dep:windows"]
# EVRTCK GPU backend: WGPU compute shaders для XOR-diff (Vulkan/Metal/DX12).
# Кросс-платформенно: Windows, macOS, Linux, Android.
# Когда включен — new_backend() пробует GPU, при неудаче падает на CPU.
gpu-accel    = ["dep:wgpu", "dep:pollster"]
# `source-build` compiles libvpx from source — works on any distro (incl. Astra),
# unlike the prebuilt path that only knows specific distributions. Needs
# build-essential + nasm + cmake (same tools openh264 already uses).
live-vpx   = ["dep:shiguredo_libvpx", "shiguredo_libvpx/source-build"]
# VP9 via the SYSTEM libvpx (apt: libvpx-dev) — for distros where building
# libvpx from source fails (old GCC + AVX-512, e.g. Astra Linux). Links `-lvpx`.
live-vpx-system = []
# VP9 via Windows Media Foundation — no external libs, works on Win10 1803+ with MSVC
live-vp9-mf = ["dep:windows"]
# NVIDIA Video Codec SDK FFI probe. Disabled by default; the driver library is
# loaded dynamically so portable builds do not require NVIDIA libs.
live-nvenc-sdk = []

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

[dependencies]
arboard = { version = "3.6", optional = true }
base64 = "0.22"
eframe = { version = "0.34", optional = true, default-features = false, features = [
    "wgpu",          # Vulkan/DX12/Metal + software fallback — no OpenGL 2.0 required
    "glow",          # OpenGL fallback for conservative Linux desktops
    "x11",           # Linux X11 desktops, including Astra's classic desktop sessions
    "wayland",       # Linux Wayland sessions
    "default_fonts", # bundled fonts
    "accesskit",     # accessibility
] }
egui-phosphor = { version = "0.12", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
openh264 = { version = "0.9", optional = true }
wgpu = { version = "29", optional = true, default-features = false }
pollster = { version = "0.3", optional = true }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shiguredo_libvpx = { version = "2026.2.0-canary.0", optional = true }
sha2 = "0.10"
socket2 = "0.5"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
zstd = { version = "0.13", default-features = false }
# libsodium-compatible NaCl crypto (pure Rust) for the RustDesk secure
# handshake: Ed25519 sign, crypto_box (X25519+XSalsa20), secretbox.
dryoc = "0.7"
rayon = "1"
mimalloc = { version = "0.1", default-features = false }

# JNI-зависимость только для Android-сборки (по фиче android-client).
jni = { version = "0.21", optional = true }
ironrdp-blocking = "0.9"
ironrdp-connector = "0.9"
ironrdp-core = "0.2"
ironrdp-graphics = "0.8"
ironrdp-session = "0.9"
ironrdp-pdu = "0.8"
native-tls = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
# Логи Android logcat
android_logger = "0.14"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
font8x8 = "0.3"
minifb = { version = "0.28", default-features = false, features = ["x11"] }
x11rb = { version = "0.13", features = ["xtest", "shm", "randr"] }

[target.'cfg(windows)'.dependencies]
font8x8 = "0.3"
minifb = { version = "0.28", default-features = false }
windows = { version = "0.48", features = [
    # VP9 MFT decoder
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    # Host: Desktop Duplication capture
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # Host: GDI screen capture
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    # Host: keyboard / mouse injection
    "Win32_UI_Input_KeyboardAndMouse",
    # WASAPI аудио — loopback capture (хост) + playback (клиент)
    "Win32_Media_Audio",
    "Win32_System_Com_StructuredStorage",
    "Win32_Devices_Properties",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
    # EVRT: перечисление сетевых интерфейсов (LAN+VPN кандидаты)
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    # Shared foundation types (HWND, HDC, HBITMAP …)
    "Win32_Foundation",
    # Hyper-V VM console (WMI)
    "Win32_System_Wmi",
    "Win32_System_Ole",
], optional = true }

# ironrdp-bulk fork: self-heals from MPPC HistoryBufferOverflow (reset +
# reprocess the same packet) instead of hard-failing the whole RDP session.
# Needed for VirtualBox VRDE specifically — even Microsoft's own mstsc.exe
# handles the same VRDE stream without issue, but every independent decoder
# we tried (including the unmodified upstream ironrdp-bulk) periodically
# desyncs against it. See vendor/ironrdp-bulk/src/mppc/mod.rs for details.
[patch.crates-io]
ironrdp-bulk = { path = "vendor/ironrdp-bulk" }
# ironrdp-session fork: fixes a real out-of-bounds panic in the bitmap-apply
# path (apply_bgr24_bitmap / apply_rgb32_bitmap / friends in image.rs).
# `rect_fits()` only validates the declared update rectangle against image
# bounds; it never checked that the actual bitmap payload length matched
# that rectangle. VirtualBox VRDE occasionally sends more row data than its
# own declared rectangle implies (yet another non-compliant-server quirk,
# alongside the empty FontMap and truncated ShareControlHeader already
# worked around elsewhere) — `chunks_exact` then yields extra rows, walking
# `row_idx` straight past the validated bound and panicking the whole
# session thread mid-frame. See vendor/ironrdp-session/src/image.rs.
ironrdp-session = { path = "vendor/ironrdp-session" }

# -----------------------------------------------------------------------
# Dev-profile optimisation: NV12→RGBA at 1920×1080×30 fps is ~620M ops/s
# which is impossible in fully unoptimised debug mode.  Level 2 gives full
# LLVM optimisation without the 20-min release compile time.
# -----------------------------------------------------------------------
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name   = "evrtck_bench"
harness = false

[profile.dev]
opt-level = 2

[profile.bench]
opt-level = 3
lto = "thin"
